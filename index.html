<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskLightly</title>
<style>
  :root { --accent:#F97316; --ink:#1e1e2e; --muted:#555; --bg:#ffffff; --line:#eee; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.65 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:64px 24px 80px; }
  header { border-bottom:3px solid var(--accent); padding-bottom:16px; margin-bottom:24px; }
  h1 { margin:0 0 4px; font-size:32px; }
  h1 .mark { color:var(--accent); }
  p { color:#222; }
  a { color:var(--accent); }
  .links { margin-top:28px; }
  .links a { display:inline-block; margin-right:20px; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="mark">✦</span> AskLightly</h1>
  </header>
  <p>AskLightly is an AI assistant for Windows: highlight any text or code, then rewrite,
     fix, explain, summarize, or ask anything — with a hotkey.</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="help.html">Help &amp; User Guide</a>
  </div>
</div>
</body>
</html>
